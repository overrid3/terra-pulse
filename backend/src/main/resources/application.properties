# --- HTTP ---
quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PATCH,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept,Authorization

# --- Datasource ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=terrapulse
quarkus.datasource.password=terrapulse
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/terrapulse

# --- Hibernate ORM ---
# Schema is owned by Flyway. Hibernate only validates entity mappings against it.
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false

# --- Flyway ---
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=db/migration

# --- OpenAPI ---
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# --- Logging ---
quarkus.log.category."com.terrapulse".level=DEBUG
