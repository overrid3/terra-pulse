# --- HTTP ---
quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PATCH,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept,Authorization

# --- Datasource ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=terrapulse
quarkus.datasource.password=terrapulse
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/terrapulse

# --- Hibernate ORM ---
# Schema is owned by Flyway. Hibernate only validates entity mappings against it.
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false

# --- Flyway ---
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=db/migration

# --- OpenAPI ---
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# --- Logging ---
quarkus.log.category."com.terrapulse".level=DEBUG

# --- Security ---
# Dev: disable all auth enforcement so `just up` works without Clerk.
%dev.quarkus.security.auth.enabled-in-dev-mode=false

# Prod: OIDC Bearer token validation against Clerk.
# Required env vars on the Oracle VM (.env.prod):
#   CLERK_ISSUER_URL=https://<your-subdomain>.clerk.accounts.dev
#   CORS_ORIGIN=https://<your-domain>   ← MUST be set; no fallback means localhost only
%prod.quarkus.oidc.application-type=service
%prod.quarkus.oidc.auth-server-url=${CLERK_ISSUER_URL}
%prod.quarkus.oidc.token.verify-audience=false
%prod.quarkus.http.cors.origins=${CORS_ORIGIN}
