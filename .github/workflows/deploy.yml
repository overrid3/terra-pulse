name: Deploy

on:
  push:
    branches: [main]

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/terra-pulse-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend native image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.native
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        timeout-minutes: 30

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render redeploy
        run: |
          response=$(curl -s --max-time 30 \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -w "\n%{http_code}")
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n1)
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Render redeploy failed. Status: $status. Response: $body"
            exit 1
          fi
          echo "Render redeploy triggered (status $status)"
